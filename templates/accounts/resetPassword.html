{% extends 'base.html' %}
{% block content %}

<!-- templates/accounts/login.html -->
<form action="{% url 'resetPassword' %}" method="POST" class="frost-auth">
    {% csrf_token %}
    <h2>Reset Password</h2>
     {% include 'alerts.html' %} 
    <input type="password" placeholder="Create Password" name="password" required>
    <input type="password" placeholder="Confirm Password" name="confirm_password" required>
    
    <button type="submit">Reset</button>
    <p>Don't have an account? <a href="{% url 'register' %}">Register</a></p>
</form>


<style>
.frost-auth {
    max-width: 350px;
    margin: 80px auto;
    padding: 30px;
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    text-align: center;
    font-family: 'Inter', sans-serif;
}

.frost-auth h2 {
    margin-bottom: 20px;
    font-weight: 900;
}

.frost-auth input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 30px;
    border: 1px solid #ddd;
    transition: 0.3s;
}

.frost-auth input:focus {
    outline: none;
    border-color: #FFD700;
    box-shadow: 0 0 0 3px rgba(255,215,0,0.2);
}

.frost-auth button {
    width: 100%;
    padding: 12px;
    border-radius: 30px;
    background: #FFD700;
    border: none;
    font-weight: 800;
    cursor: pointer;
    transition: 0.3s;
}

.frost-auth button:hover {
    transform: translateY(-2px);
}

.frost-auth p {
    margin-top: 10px;
    font-size: 0.85rem;
}

.frost-auth a {
    color: black;
    font-weight: 700;
}

.forgot-password {
    text-align: right;
    margin-bottom: 15px;
}

.forgot-password a {
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    color: #555;
    position: relative;
    transition: all 0.3s ease;
}

/* underline animation */
.forgot-password a::after {
    content: '';
    position: absolute;
    width: 0%;
    height: 2px;
    bottom: -2px;
    left: 0;
    background: #FFD700; /* Frost yellow */
    transition: 0.3s;
}

.forgot-password a:hover {
    color: #000;
}

.forgot-password a:hover::after {
    width: 100%;
}

</style>

{% endblock %}
