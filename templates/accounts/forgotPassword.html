{% extends 'base.html' %}
{% block content %}

<div class="forgot-wrapper">

    <div class="forgot-box">
        <h2>Forgot Password</h2>
        {% include 'alerts.html' %}

        <form method="POST" action="{% url 'forgotPassword' %}">
            {% csrf_token %}

            <input type="email" name="email" placeholder="Email Address" required>

            <div class="login-link">
                <a href="{% url 'login' %}">Got password? Login</a>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

    <p class="signup-text">
        Don't have account?
        <a href="{% url 'register' %}">Sign up</a>
    </p>

</div>

<style>
:root {
    --frost-yellow: #FFD700;
    --frost-dark: #1a1a1a;
}

/* Wrapper */
.forgot-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    animation: fadeUp 0.6s ease;
}

/* Card */
.forgot-box {
    width: 350px;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    text-align: center;
}

/* Title */
.forgot-box h2 {
    font-weight: 900;
    margin-bottom: 20px;
}

/* Input */
.forgot-box input {
    width: 100%;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #ddd;
    margin-bottom: 10px;
    transition: 0.3s;
}

.forgot-box input:focus {
    outline: none;
    border-color: var(--frost-yellow);
    box-shadow: 0 0 0 3px rgba(255,215,0,0.2);
}

/* Login link */
.login-link {
    text-align: right;
    margin-bottom: 15px;
}

.login-link a {
    text-decoration: none;
    font-size: 0.85rem;
    color: #555;
    position: relative;
    transition: 0.3s;
}

.login-link a::after {
    content: '';
    position: absolute;
    width: 0%;
    height: 2px;
    left: 0;
    bottom: -2px;
    background: var(--frost-yellow);
    transition: 0.3s;
}

.login-link a:hover::after {
    width: 100%;
}

/* Button */
.forgot-box button {
    width: 100%;
    padding: 12px;
    border-radius: 6px;
    border: none;
    background: var(--frost-yellow);
    color: var(--frost-dark);
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
}

.forgot-box button:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
}



/* Signup text */
.signup-text {
    margin-top: 15px;
    font-size: 0.9rem;
}

.signup-text a {
    text-decoration: none;
    color: var(--frost-dark);
    font-weight: 600;
    position: relative;
}

.signup-text a::after {
    content: '';
    position: absolute;
    width: 0%;
    height: 2px;
    left: 0;
    bottom: -2px;
    background: var(--frost-yellow);
    transition: 0.3s;
}

.signup-text a:hover::after {
    width: 100%;
}

/* Animation */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

{% endblock %}
